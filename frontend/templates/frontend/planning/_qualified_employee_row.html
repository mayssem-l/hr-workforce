{% load frontend_format %}
<tr>
  <th scope="row">
    <a class="profile-table-primary" href="{{ row.profile_url }}">{{ row.employee }}</a>
    <span class="profile-table-secondary">{{ row.employee.position }} · {{ row.employee.department }}</span>
  </th>
  <td>Level {{ row.level }} of 5</td>
  <td class="data-table__number">{{ row.available_hours|decimal_hours }}</td>
</tr>
