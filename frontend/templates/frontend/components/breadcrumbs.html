{% if items %}
  <nav class="app-breadcrumbs" aria-label="Breadcrumb">
    <ol>
      {% for item in items %}
        <li{% if forloop.last %} aria-current="page"{% endif %}>
          {% if item.url and not forloop.last %}
            <a href="{{ item.url }}">{{ item.label }}</a>
          {% else %}
            <span>{{ item.label }}</span>
          {% endif %}
        </li>
      {% endfor %}
    </ol>
  </nav>
{% endif %}
